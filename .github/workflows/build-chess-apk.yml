name: Build Tática 64 APK
on:
  push:
    branches: [build/chess-tactics-android16]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tatica64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Tatica64-Android16
          path: Tatica64/app/build/outputs/apk/debug/app-debug.apk
