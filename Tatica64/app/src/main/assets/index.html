function sqTx(s,m){let f=s.charCodeAt(0)-97,r=+s[1];if(m===1)f=7-f;if(m===2){f=7-f;r=9-r}if(m===3)r=9-r;return String.fromCharCode(97+f)+r}function fenTx(f,m){let p=f.split(' '),rows=p[0].split('/').map(x=>{let a=[];for(let c of x){if(/\d/.test(c))for(let i=0;i<+c;i++)a.push('1');else a.push(c)}return a});if(m===1||m===2)rows=rows.map(x=>x.reverse());if(m===2||m===3)rows=rows.reverse();if(m===2||m===3)rows=rows.map(x=>x.map(c=>c==='1'?c:(c===c.toUpperCase()?c.toLowerCase():c.toUpperCase())));let out=rows.map(x=>{let z='',n=0;for(let c of x){if(c==='1')n++;else{if(n){z+=n;n=0}z+=c}}if(n)z+=n;return z}).join('/');let a=p[1];if(m===2||m===3)a=a==='w'?'b':'w';return out+' '+a+' - - 0 1'}function movesTx(ms,m){return ms.split(' ').map(x=>sqTx(x.slice(0,2),m)+sqTx(x.slice(2,4),m)+x.slice(4)).join(' ')}
const puzzles=[];for(let v=0;v<5;v++)for(let b of base){let m=v%4;puzzles.push({fen:fenTx(b[1],m),moves:movesTx(b[2],m).split(' '),rating:Math.max(500,Math.min(2000,b[3]+(v-2)*110)),theme:b[4]})}const pc={K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};let filtered=puzzles.slice(),idx=+(localStorage.t64idx||0)%150,board={},turn='w',selected=null,lastMove=null,hintSq=null,step=0,userColor='w',wrong=+(localStorage.t64wrong||0),solved=+(localStorage.t64solved||0),streak=+(localStorage.t64streak||0);function parseFen(f){board={};let [pos,side]=f.split(' '),r=8;for(let row of pos.split('/')){let file=0;for(let c of row){if(/\d/.test(c))file+=+c;else{board[String.fromCharCode(97+file)+r]=c;file++}}r--}turn=side}function applyMove(m){let a=m.slice(0,2),b=m.slice(2,4),promo=m[4],p=board[a];if(!p)return;delete board[a];if((p==='P'||p==='p')&&a[0]!==b[0]&&!board[b])delete board[b[0]+(p==='P'?(+b[1]-1):(+b[1]+1))];board[b]=promo?(p===p.toUpperCase()?promo.toUpperCase():promo.toLowerCase()):p;turn=turn==='w'?'b':'w';lastMove=[a,b]}function loadPuzzle(){let p=filtered[idx%filtered.length];parseFen(p.fen);step=0;applyMove(p.moves[step++]);userColor=turn;selected=null;hintSq=null;puzzleTitle.textContent=`Problema ${(idx%filtered.length)+1}/${filtered.length}`;rating.textContent='★ '+p.rating;theme.textContent=p.theme;setMsg('Sua vez. Encontre a melhor continuação.','');render();updateStats()}function coords(){let a=[],w=userColor==='w';for(let rr=0;rr<8;rr++)for(let ff=0;ff<8;ff++){let f=w?ff:7-ff,r=w?8-rr:1+rr;a.push(String.fromCharCode(97+f)+r)}return a}function render(){boardEl=document.getElementById('board');boardEl.innerHTML='';coords().forEach((s,j)=>{let f=s.charCodeAt(0)-97,r=+s[1],d=document.createElement('div');d.className='sq '+(((f+r)%2)?'light':'dark');if(selected===s)d.classList.add('sel');if(lastMove&&lastMove.includes(s))d.classList.add('last');if(hintSq===s)d.classList.add('hint');if(board[s])d.innerHTML=`<span class="piece">${pc[board[s]]}</span>`;let row=Math.floor(j/8),col=j%8;if(col===0)d.innerHTML+=`<span class="coord rank">${s[1]}</span>`;if(row===7)d.innerHTML+=`<span class="coord file">${s[0]}</span>`;d.onclick=()=>tap(s);boardEl.appendChild(d)})}function tap(s){let p=filtered[idx%filtered.length];if(step>=p.moves.length)return;if(!selected){if(board[s]&&((userColor==='w'&&board[s]===board[s].toUpperCase())||(userColor==='b'&&board[s]===board[s].toLowerCase()))){selected=s;hintSq=null;render()}return}if(s===selected){selected=null;render();return}let e=p.moves[step];if(e.slice(0,4)===selected+s){applyMove(e);step++;selected=null;setMsg('✓ Melhor lance!','ok');render();if(step>=p.moves.length){solved++;streak++;localStorage.t64solved=solved;localStorage.t64streak=streak;setMsg('🏆 Problema resolvido!','ok');updateStats();return}setTimeout(()=>{applyMove(p.moves[step++]);setMsg('Boa! Continue a combinação.','ok');render()},350)}else{wrong++;streak=0;localStorage.t64wrong=wrong;localStorage.t64streak=streak;selected=null;setMsg('✕ Não é o melhor lance. Tente novamente.','bad');updateStats();render()}}function setMsg(t,c){message.textContent=t;message.className='message '+c}function updateStats(){document.getElementById('solved').textContent=solved;document.getElementById('streak').textContent=streak;accuracy.textContent=Math.round(100*solved/Math.max(1,solved+wrong))+'%';bar.style.width=(100*((idx%filtered.length)+1)/filtered.length)+'%'}hintBtn.onclick=()=>{let m=filtered[idx%filtered.length].moves[step];if(m){hintSq=m.slice(0,2);setMsg('Dica: observe a peça destacada.','');render()}};nextBtn.onclick=()=>{idx=(idx+1)%filtered.length;localStorage.t64idx=idx;loadPuzzle()};document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');let r=c.dataset.range;if(r==='all')filtered=puzzles.slice();else{let [a,b]=r.split('-').map(Number);filtered=puzzles.filter(p=>p.rating>=a&&p.rating<=b)}idx=0;loadPuzzle()});l
